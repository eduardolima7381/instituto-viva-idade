    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <header>
        <div class="marca">
            <svg width="36" height="36" viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="42" cy="42" r="34" fill="#6FBF95"/>
                <path d="M42 62c-14-9-22-18-22-28a13 13 0 0 1 22-9 13 13 0 0 1 22 9c0 10-8 19-22 28z" fill="#F7F5F2"/>
            </svg>
        <h1>Instituto Viva Idade</h1>
        </div>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-hamburguer" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
            <li class="tem-submenu">
                <a href="projetos.html">Projetos Sociais</a>
                <ul class="submenu">
                        <li><a href="projetos.html#voluntariado">Voluntariado</a></li>
                        <li><a href="projetos.html#doacoes">Doações</a></li>
                </ul>
            </li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <form>
    <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
    </fieldset>
    <fieldset>
        <legend>Endereço</legend>
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" required>
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>
        <label for="estado">UF</label>
        <input type="text" id="estado" name="estado" maxlength="2" pattern="[A-Za-z]{2}" placeholder="SP" required>
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="\d{5}-\d{3}" required>
    </fieldset>
    <fieldset>
        <legend>Telefone e CPF</legend>
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00)00000-0000" pattern="\(\d{2}\)\d{5}-\d{4}" required>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
    </fieldset>
    <button type="submit">Enviar cadastro</button>
        </form>
        </main>
    <footer>
        <p>&copy; 2026 Instituto Viva Idade. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
